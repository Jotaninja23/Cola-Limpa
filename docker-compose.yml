services:
  postgres:
    image: postgres:16-alpine
    container_name: colalimpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colalimpa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-colalimpa}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - colalimpa-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colalimpa-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-colalimpa}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - colalimpa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: colalimpa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - colalimpa-network

volumes:
  postgres_data:

networks:
  colalimpa-network:
    driver: bridge

