<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2619"/>
      <stop offset="50%" stop-color="#2B1A10"/>
      <stop offset="100%" stop-color="#1A0F08"/>
    </linearGradient>

    <!-- Candle Body Gradient -->
    <linearGradient id="mainLogoCandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B86638"/>
      <stop offset="50%" stop-color="#9C5228"/>
      <stop offset="100%" stop-color="#6E3516"/>
    </linearGradient>

    <!-- Outer Flame / Glow Gradient -->
    <radialGradient id="mainLogoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C57D1E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C57D1E" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Flame / Glue Drop Gradient -->
    <linearGradient id="mainLogoFlame" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D9631E"/>
      <stop offset="100%" stop-color="#B43D12"/>
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="mainLogoInnerFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Saucer / Base Gradient -->
    <linearGradient id="mainLogoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A6A"/>
      <stop offset="50%" stop-color="#A56338"/>
      <stop offset="100%" stop-color="#633719"/>
    </linearGradient>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="120" height="120" rx="28" fill="url(#mainLogoBg)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="#E2D7C8" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Warm Flame Ambient Glow -->
  <circle cx="60" cy="36" r="34" fill="url(#mainLogoGlow)"/>

  <!-- Saucer / Base -->
  <ellipse cx="60" cy="95" rx="34" ry="7" fill="url(#mainLogoBase)"/>
  <ellipse cx="60" cy="94" rx="31" ry="5.5" fill="#422513"/>
  <ellipse cx="60" cy="93.5" rx="28" ry="4" fill="#6E3B1C"/>

  <!-- Candle Body -->
  <rect x="44" y="58" width="32" height="36" rx="4" fill="url(#mainLogoCandle)"/>

  <!-- Melted Wax / Glue Drop (Gota de Cola / Cera escorrendo) -->
  <path d="M44 64 C44 70, 48 72, 48 67 C48 62, 44 60, 44 64 Z" fill="#D9804E"/>
  <path d="M76 60 C76 65, 78 72, 78 76 C78 78.5, 75.5 80, 74 78 C72.5 76, 73 70, 74 65 Z" fill="#D9804E"/>
  <circle cx="76.5" cy="76.5" r="2.2" fill="#ECA272"/>

  <!-- Candle Wax Top Rim -->
  <ellipse cx="60" cy="58" rx="16" ry="4.5" fill="#C27344"/>
  <ellipse cx="60" cy="58.5" rx="13" ry="3" fill="#84411C"/>

  <!-- Wick -->
  <path d="M60 58 Q59 52 61 46" stroke="#24140B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Flame / Droplet of Glue -->
  <path d="M60 17 C66 26, 76 34, 76 43 C76 52, 69 57, 60 57 C51 57, 44 52, 44 43 C44 34, 54 26, 60 17 Z" fill="url(#mainLogoFlame)"/>
  <path d="M60 27 C63 32, 69 37, 69 43 C69 48, 65 52, 60 52 C55 52, 51 48, 51 43 C51 37, 57 32, 60 27 Z" fill="url(#mainLogoInnerFlame)"/>

  <!-- Sparkle Star (Sabedoria / XP) -->
  <path d="M54 33 Q54 30 52 30 Q54 30 54 27 Q54 30 56 30 Q54 30 54 33 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>

