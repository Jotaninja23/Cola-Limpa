<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="glueBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2619"/>
      <stop offset="100%" stop-color="#1A0F08"/>
    </linearGradient>

    <!-- Glue Body Gradient -->
    <linearGradient id="glueTubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4ECE1"/>
      <stop offset="100%" stop-color="#D9CBB7"/>
    </linearGradient>

    <linearGradient id="glueCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C57D1E"/>
      <stop offset="60%" stop-color="#9C5228"/>
      <stop offset="100%" stop-color="#643012"/>
    </linearGradient>

    <linearGradient id="glueTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D9631E"/>
    </linearGradient>

    <filter id="glueShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="120" height="120" rx="28" fill="url(#glueBgGrad)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="#E2D7C8" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Glow effect -->
  <circle cx="68" cy="38" r="32" fill="#C57D1E" fill-opacity="0.2"/>

  <!-- Glue Tube rotated dynamically at 25deg -->
  <g transform="rotate(-18 60 65)" filter="url(#glueShadow)">
    <!-- Base Roller / Knob -->
    <rect x="46" y="92" width="28" height="10" rx="3" fill="#643012"/>
    <line x1="52" y1="92" x2="52" y2="102" stroke="#4A220B" stroke-width="1.5"/>
    <line x1="60" y1="92" x2="60" y2="102" stroke="#4A220B" stroke-width="1.5"/>
    <line x1="68" y1="92" x2="68" y2="102" stroke="#4A220B" stroke-width="1.5"/>

    <!-- Glue Stick Main Body -->
    <rect x="44" y="48" width="32" height="46" rx="4" fill="url(#glueTubeGrad)"/>

    <!-- Decorative Label on Glue Stick -->
    <rect x="44" y="58" width="32" height="24" fill="url(#glueCapGrad)"/>
    <rect x="47" y="64" width="26" height="5" rx="2" fill="#FFFDF7" opacity="0.9"/>
    <rect x="49" y="72" width="22" height="3" rx="1.5" fill="#FFE5A3" opacity="0.8"/>

    <!-- Shoulder / Collar of Tube -->
    <path d="M47 48 L49 42 L71 42 L73 48 Z" fill="#9C5228"/>

    <!-- Translucent Adhesive Glue Core / Candle Hybrid Column -->
    <rect x="51" y="28" width="18" height="15" rx="3" fill="url(#glueTipGrad)"/>

    <!-- Glowing Flame & Adhesive Droplet emanating from top -->
    <path d="M60 6 
             C65 14, 73 20, 73 28 
             C73 35, 67 39, 60 39 
             C53 39, 47 35, 47 28 
             C47 20, 55 14, 60 6 Z" 
          fill="url(#glueTipGrad)"/>
    
    <!-- Inner bright light / flame -->
    <path d="M60 14 
             C62 18, 68 22, 68 28 
             C68 33, 64 36, 60 36 
             C56 36, 52 33, 52 28 
             C52 22, 58 18, 60 14 Z" 
          fill="#FFFDF7"/>

    <!-- Little glue droplets / sparks of focus -->
    <circle cx="78" cy="18" r="3" fill="#FFE885"/>
    <circle cx="40" cy="24" r="2" fill="#F59E0B"/>
  </g>
</svg>

