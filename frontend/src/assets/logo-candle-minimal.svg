<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362317"/>
      <stop offset="100%" stop-color="#20130B"/>
    </linearGradient>
    <linearGradient id="minFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C57D1E"/>
    </linearGradient>
    <linearGradient id="minBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C57B57"/>
      <stop offset="100%" stop-color="#9C5228"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#minBg)"/>

  <!-- Candle Base / Saucer -->
  <path d="M16 52 C16 50, 48 50, 48 52 C48 56, 16 56, 16 52 Z" fill="#6B3A1C"/>
  <rect x="22" y="32" width="20" height="20" rx="3" fill="url(#minBody)"/>

  <!-- Glue drip / wax drip -->
  <path d="M42 35 C42 41, 45 42, 44 45 C43 47, 41 46, 41 43 Z" fill="#D98A62"/>

  <!-- Candle Top Rim -->
  <ellipse cx="32" cy="32" rx="10" ry="2.5" fill="#E29571"/>

  <!-- Wick -->
  <line x1="32" y1="32" x2="32" y2="26" stroke="#24140B" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Flame (Gota / Vela) -->
  <path d="M32 9 
           C36 15, 42 20, 42 25 
           C42 30, 38 33, 32 33 
           C26 33, 22 30, 22 25 
           C22 20, 28 15, 32 9 Z" 
        fill="url(#minFlame)"/>

  <!-- Inner Spark -->
  <ellipse cx="32" cy="26" rx="4" ry="5" fill="#FFFDF7" opacity="0.9"/>
</svg>

